<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Academic Portal – Sign in</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
  <main class="login-card">
    <h1>Academic Portal</h1>
    <p>University Administration</p>
    <form id="loginForm">
      <label class="field"><span>Username</span>
        <input name="username" required autofocus autocomplete="username"></label>
      <label class="field"><span>Password</span>
        <input type="password" name="password" required autocomplete="current-password"></label>
      <div class="form-error" id="err" hidden></div>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
    <div class="hint">Administrators, faculty and students sign in here.</div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
